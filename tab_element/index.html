<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabs</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="tabs-container">

      <!-- Tabs -->
        <div class="tabs">
            <button class="tab active" onclick="showTab(1)">TAB 1</button>
            <button class="tab" onclick="showTab(2)">TAB 2</button>
            <button class="tab" onclick="showTab(3)">TAB 3</button>
            <button class="tab" onclick="showTab(4)">TAB 4</button>
        </div>

        <!-- Content -->
        <div class="content">
            <div id="tab1" >
                Content for TAB 1
            </div>

            <div id="tab2" >
                Content for TAB 2
            </div>

            <div id="tab3" >
                Content for TAB 3
            </div>

            <div id="tab4" >
                Content for TAB 4
            </div>
        </div>

    </div>

    <script src="script.js"></script>
</body>
</html>
